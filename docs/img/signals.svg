<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="450" viewBox="0 0 1400 450">
<defs>
<linearGradient id="rb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ff6b6b"/><stop offset="0.2" stop-color="#ffb347"/><stop offset="0.4" stop-color="#ffe66d"/>
<stop offset="0.6" stop-color="#7bed9f"/><stop offset="0.8" stop-color="#70a1ff"/><stop offset="1" stop-color="#c56cf0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2235"/></pattern>
<style>.s{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
</defs>
<rect width="1400" height="450" fill="#0b0d14"/><rect width="1400" height="450" fill="url(#dots)"/>
<rect x="30" y="28" width="1340" height="5" rx="3" fill="url(#rb)"/>
<text class="s" x="30" y="80" font-size="13" letter-spacing="3" fill="#8b93a7">FOUR KINDS OF SIGNAL</text><text class="s" x="30" y="122" font-size="34" font-weight="800" fill="#f3f4f6">What the radar hears</text><rect x="30" y="160" width="320" height="260" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="30" y="160" width="320" height="4" rx="2" fill="#ff6b6b"/><text class="s" x="52" y="200" font-size="11" letter-spacing="3" fill="#ff6b6b">01 / PHRASES</text><text class="s" x="52" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Launch vocabulary</text><text class="s" x="52" y="260" font-size="14" fill="#aab2c5">~150 phrases in six groups.</text><text class="s" x="52" y="282" font-size="14" fill="#aab2c5">Direct, first post, stealth,</text><text class="s" x="52" y="304" font-size="14" fill="#aab2c5">crypto, product, stop.</text><rect x="52" y="316" width="276" height="80" rx="8" fill="#080a10" stroke="#1b2235"/><text class="m" x="64" y="336" font-size="13" fill="#ff6b6b">"introducing"</text><text class="m" x="64" y="358" font-size="13" fill="#ff6b6b">"we're live"</text><text class="m" x="64" y="380" font-size="13" fill="#ff6b6b">"out of stealth"</text><rect x="370" y="160" width="320" height="260" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="370" y="160" width="320" height="4" rx="2" fill="#ffe66d"/><text class="s" x="392" y="200" font-size="11" letter-spacing="3" fill="#ffe66d">02 / LINKS</text><text class="s" x="392" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Hard evidence</text><text class="s" x="392" y="260" font-size="14" fill="#aab2c5">An announcement carries a link:</text><text class="s" x="392" y="282" font-size="14" fill="#aab2c5">site, repo, waitlist, app store.</text><text class="s" x="392" y="304" font-size="14" fill="#aab2c5">The host hints at the kind.</text><rect x="392" y="316" width="276" height="80" rx="8" fill="#080a10" stroke="#1b2235"/><text class="m" x="404" y="336" font-size="13" fill="#ffe66d">lumen.app</text><text class="m" x="404" y="358" font-size="13" fill="#ffe66d">github.com/…</text><text class="m" x="404" y="380" font-size="13" fill="#ffe66d">apps.apple.com/…</text><rect x="710" y="160" width="320" height="260" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="710" y="160" width="320" height="4" rx="2" fill="#7bed9f"/><text class="s" x="732" y="200" font-size="11" letter-spacing="3" fill="#7bed9f">03 / AUTHOR</text><text class="s" x="732" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Who is saying it</text><text class="s" x="732" y="260" font-size="14" fill="#aab2c5">Account age, tweet count,</text><text class="s" x="732" y="282" font-size="14" fill="#aab2c5">follow ratios, pinned post.</text><text class="s" x="732" y="304" font-size="14" fill="#aab2c5">New voice or old megaphone?</text><rect x="732" y="316" width="276" height="80" rx="8" fill="#080a10" stroke="#1b2235"/><text class="m" x="744" y="336" font-size="13" fill="#7bed9f">4 days old · 3 tweets</text><text class="m" x="744" y="358" font-size="13" fill="#7bed9f">announcement pinned</text><text class="m" x="744" y="380" font-size="13" fill="#7bed9f">2 years · 14k tweets</text><rect x="1050" y="160" width="320" height="260" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="1050" y="160" width="320" height="4" rx="2" fill="#70a1ff"/><text class="s" x="1072" y="200" font-size="11" letter-spacing="3" fill="#70a1ff">04 / GROWTH</text><text class="s" x="1072" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Velocity</text><text class="s" x="1072" y="260" font-size="14" fill="#aab2c5">Two measurements of the same post.</text><text class="s" x="1072" y="282" font-size="14" fill="#aab2c5">(likes + 3·reposts) per minute.</text><text class="s" x="1072" y="304" font-size="14" fill="#aab2c5">Quiet, then everyone at once.</text><rect x="1072" y="316" width="276" height="80" rx="8" fill="#080a10" stroke="#1b2235"/><text class="m" x="1084" y="336" font-size="13" fill="#70a1ff">4 → 61 likes / 30m</text><text class="m" x="1084" y="358" font-size="13" fill="#70a1ff">velocity 2.3 / min</text><text class="m" x="1084" y="380" font-size="13" fill="#70a1ff">+20 points</text></svg>
