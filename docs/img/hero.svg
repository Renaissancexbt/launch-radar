<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.2" stop-color="#ffb347"/>
      <stop offset="0.4" stop-color="#ffe66d"/>
      <stop offset="0.6" stop-color="#7bed9f"/>
      <stop offset="0.8" stop-color="#70a1ff"/>
      <stop offset="1" stop-color="#c56cf0"/>
    </linearGradient>
    <linearGradient id="rainbowV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.25" stop-color="#ffe66d"/>
      <stop offset="0.5" stop-color="#7bed9f"/>
      <stop offset="0.75" stop-color="#70a1ff"/>
      <stop offset="1" stop-color="#c56cf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7bed9f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7bed9f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dish" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="1" stop-color="#121829"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7bed9f" stop-opacity="0"/>
      <stop offset="1" stop-color="#7bed9f" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e2740"/>
    </pattern>
    <style>
      .sans { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0b0d14"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect x="150" y="70" width="1300" height="790" rx="26" fill="#0d1019" stroke="#1b2235"/>
  <rect x="190" y="68" width="1220" height="5" rx="3" fill="url(#rainbow)"/>

  <!-- eyebrow -->
  <circle cx="232" cy="145" r="6" fill="#7bed9f"/>
  <text class="sans" x="252" y="150" font-size="14" letter-spacing="3" fill="#8b93a7">LOCAL FIRST / OPEN SOURCE / ZERO DEPENDENCIES</text>

  <!-- title -->
  <text class="sans" x="226" y="300" font-size="118" font-weight="800" letter-spacing="-4" fill="#f3f4f6">launch<tspan fill="url(#rainbow)">radar</tspan><tspan font-size="60" fill="#3b4663" font-weight="400"> /</tspan></text>
  <text class="sans" x="228" y="395" font-size="58" font-weight="500" fill="#e5e7eb">Hear it</text>
  <text class="sans" x="228" y="465" font-size="58" font-weight="800" fill="url(#rainbow)">before it's loud.</text>

  <text class="sans" x="228" y="525" font-size="22" fill="#b4bccf">Your feed has a new lookout.</text>
  <text class="sans" x="228" y="560" font-size="22" fill="#b4bccf">A small radar that scores launch posts before anyone retweets them.</text>

  <!-- pills -->
  <rect x="228" y="600" width="190" height="46" rx="23" fill="#0f1a16" stroke="#2c5a46"/>
  <circle cx="254" cy="623" r="5" fill="#7bed9f"/>
  <text class="sans" x="268" y="629" font-size="14" fill="#cfe9dc" letter-spacing="1">RUNS ON YOUR PC</text>
  <rect x="430" y="600" width="170" height="46" rx="23" fill="#15132a" stroke="#4a3f80"/>
  <text class="sans" x="452" y="629" font-size="14" fill="#d9d4f5" letter-spacing="1">PYTHON · CLI</text>
  <rect x="612" y="600" width="170" height="46" rx="23" fill="#1a1620" stroke="#5a3f4f"/>
  <text class="sans" x="634" y="629" font-size="14" fill="#f3d9e5" letter-spacing="1">SCORES 0–100</text>

  <text class="sans" x="228" y="700" font-size="13" letter-spacing="3" fill="#5b6478">LAUNCH PHRASES. HARD EVIDENCE. EXPLAINED POINTS.</text>

  <!-- mascot: the radar -->
  <g transform="translate(1250 430)">
    <circle r="230" fill="url(#glow)"/>
    <circle r="200" fill="none" stroke="#1e2740"/>
    <circle r="150" fill="none" stroke="#1e2740"/>
    <!-- sweep -->
    <path d="M0 0 L200 0 A200 200 0 0 0 100 -173 Z" fill="url(#sweep)" opacity="0.9"/>
    <line x1="0" y1="0" x2="200" y2="0" stroke="#7bed9f" stroke-width="3" stroke-linecap="round"/>
    <!-- blips -->
    <g>
      <circle cx="120" cy="-70" r="8" fill="#ffe66d"/>
      <circle cx="120" cy="-70" r="16" fill="none" stroke="#ffe66d" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="-110" cy="95" r="6" fill="#70a1ff"/>
      <circle cx="-150" cy="-110" r="5" fill="#ff6b6b"/>
      <circle cx="60" cy="150" r="5" fill="#c56cf0"/>
    </g>
    <!-- string from top like his spider thread -->
    <line x1="0" y1="-330" x2="0" y2="-215" stroke="#2a3350" stroke-width="2"/>
    <!-- dish body -->
    <g>
      <ellipse cx="0" cy="-20" rx="118" ry="150" fill="url(#dish)" stroke="url(#rainbowV)" stroke-width="7"/>
      <ellipse cx="-40" cy="-80" rx="34" ry="52" fill="#ffffff" opacity="0.08"/>
      <!-- feed horn / antenna -->
      <line x1="0" y1="-170" x2="0" y2="-215" stroke="#9aa3b8" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="-222" r="12" fill="#ffe66d"/>
      <circle cx="0" cy="-222" r="22" fill="none" stroke="#ffe66d" stroke-opacity="0.5" stroke-width="2"/>
      <!-- face plate -->
      <circle cx="0" cy="25" r="78" fill="#0c0f1a" stroke="#2b3450" stroke-width="3"/>
      <!-- eyes -->
      <circle cx="-30" cy="12" r="24" fill="#ffffff"/>
      <circle cx="30" cy="12" r="24" fill="#ffffff"/>
      <circle cx="-25" cy="16" r="13" fill="#0b0d14"/>
      <circle cx="35" cy="16" r="13" fill="#0b0d14"/>
      <circle cx="-20" cy="10" r="4" fill="#ffffff"/>
      <circle cx="40" cy="10" r="4" fill="#ffffff"/>
      <!-- smile -->
      <path d="M-22 52 Q0 70 22 52" stroke="#c56cf0" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- legs / stand -->
    <g stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M-90 90 L-150 170 L-200 160" stroke="#ff6b6b"/>
      <path d="M-60 110 L-80 200 L-130 230" stroke="#ffb347"/>
      <path d="M60 110 L80 200 L130 230" stroke="#70a1ff"/>
      <path d="M90 90 L150 170 L200 160" stroke="#c56cf0"/>
    </g>
    <circle cx="-150" cy="170" r="7" fill="#ff6b6b"/>
    <circle cx="150" cy="170" r="7" fill="#c56cf0"/>
    <text class="sans" x="-250" y="-10" font-size="34" fill="#c56cf0">+</text>
    <text class="sans" x="200" y="230" font-size="34" fill="#7bed9f">+</text>
  </g>

  <!-- four steps -->
  <rect x="228" y="760" width="1144" height="90" rx="16" fill="#0a0c13" stroke="#1b2235"/>
  <g class="sans">
    <text x="256" y="792" font-size="11" letter-spacing="3" fill="#ff6b6b">01 / LISTEN</text>
    <text x="256" y="822" font-size="21" font-weight="700" fill="#f3f4f6">Watch the phrases</text>
    <text x="256" y="842" font-size="13" fill="#8b93a7">150 launch phrases. Six groups.</text>

    <line x1="536" y1="776" x2="536" y2="836" stroke="#1b2235"/>
    <text x="560" y="792" font-size="11" letter-spacing="3" fill="#ffe66d">02 / EXTRACT</text>
    <text x="560" y="822" font-size="21" font-weight="700" fill="#f3f4f6">Pull the evidence</text>
    <text x="560" y="842" font-size="13" fill="#8b93a7">Link, host, category, author.</text>

    <line x1="840" y1="776" x2="840" y2="836" stroke="#1b2235"/>
    <text x="864" y="792" font-size="11" letter-spacing="3" fill="#7bed9f">03 / VERIFY</text>
    <text x="864" y="822" font-size="21" font-weight="700" fill="#f3f4f6">Check the author</text>
    <text x="864" y="842" font-size="13" fill="#8b93a7">Account age, pinned, growth.</text>

    <line x1="1128" y1="776" x2="1128" y2="836" stroke="#1b2235"/>
    <text x="1152" y="792" font-size="11" letter-spacing="3" fill="#70a1ff">04 / SCORE</text>
    <text x="1152" y="822" font-size="21" font-weight="700" fill="#f3f4f6">Explain the number</text>
    <text x="1152" y="842" font-size="13" fill="#8b93a7">0–100. Every point has a reason.</text>
  </g>
</svg>
