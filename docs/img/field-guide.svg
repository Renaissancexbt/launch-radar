<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400">
<defs>
<linearGradient id="rb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ff6b6b"/><stop offset="0.2" stop-color="#ffb347"/><stop offset="0.4" stop-color="#ffe66d"/>
<stop offset="0.6" stop-color="#7bed9f"/><stop offset="0.8" stop-color="#70a1ff"/><stop offset="1" stop-color="#c56cf0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2235"/></pattern>
<style>.s{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
</defs>
<rect width="1400" height="400" fill="#0b0d14"/><rect width="1400" height="400" fill="url(#dots)"/>
<rect x="30" y="28" width="1340" height="5" rx="3" fill="url(#rb)"/>
<text class="s" x="30" y="80" font-size="13" letter-spacing="3" fill="#8b93a7">WHAT IT PROMISES, WHAT IT DOESN'T</text><text class="s" x="30" y="122" font-size="34" font-weight="800" fill="#f3f4f6">Field guide</text><rect x="30" y="160" width="320" height="210" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="30" y="160" width="320" height="4" rx="2" fill="#7bed9f"/><text class="s" x="52" y="200" font-size="11" letter-spacing="3" fill="#7bed9f">LOCAL</text><text class="s" x="52" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Nothing leaves your machine</text><text class="s" x="52" y="260" font-size="14" fill="#aab2c5">No API keys. No database.</text><text class="s" x="52" y="282" font-size="14" fill="#aab2c5">No server. No telemetry.</text><text class="s" x="52" y="304" font-size="14" fill="#aab2c5">Pure Python, zero dependencies.</text><rect x="370" y="160" width="320" height="210" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="370" y="160" width="320" height="4" rx="2" fill="#ffe66d"/><text class="s" x="392" y="200" font-size="11" letter-spacing="3" fill="#ffe66d">EXPLAINED</text><text class="s" x="392" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Every point has a reason</text><text class="s" x="392" y="260" font-size="14" fill="#aab2c5">A score of 85 ships with the</text><text class="s" x="392" y="282" font-size="14" fill="#aab2c5">nine lines that made it 85.</text><text class="s" x="392" y="304" font-size="14" fill="#aab2c5">Disagree with any of them.</text><rect x="710" y="160" width="320" height="210" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="710" y="160" width="320" height="4" rx="2" fill="#70a1ff"/><text class="s" x="732" y="200" font-size="11" letter-spacing="3" fill="#70a1ff">TUNABLE</text><text class="s" x="732" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Weights are plain numbers</text><text class="s" x="732" y="260" font-size="14" fill="#aab2c5">Two files. Change one, run</text><text class="s" x="732" y="282" font-size="14" fill="#aab2c5">pytest; the sample set pins the</text><text class="s" x="732" y="304" font-size="14" fill="#aab2c5">ranking you expect.</text><rect x="1050" y="160" width="320" height="210" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="1050" y="160" width="320" height="4" rx="2" fill="#ff6b6b"/><text class="s" x="1072" y="200" font-size="11" letter-spacing="3" fill="#ff6b6b">HONEST</text><text class="s" x="1072" y="232" font-size="21" font-weight="700" fill="#f3f4f6">A lead, not a verdict</text><text class="s" x="1072" y="260" font-size="14" fill="#aab2c5">A high score means new project,</text><text class="s" x="1072" y="282" font-size="14" fill="#aab2c5">people noticing. Not safety,</text><text class="s" x="1072" y="304" font-size="14" fill="#aab2c5">not originality, not returns.</text></svg>
