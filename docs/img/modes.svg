<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430">
<defs>
<linearGradient id="rb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ff6b6b"/><stop offset="0.2" stop-color="#ffb347"/><stop offset="0.4" stop-color="#ffe66d"/>
<stop offset="0.6" stop-color="#7bed9f"/><stop offset="0.8" stop-color="#70a1ff"/><stop offset="1" stop-color="#c56cf0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2235"/></pattern>
<style>.s{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
</defs>
<rect width="1400" height="430" fill="#0b0d14"/><rect width="1400" height="430" fill="url(#dots)"/>
<rect x="30" y="28" width="1340" height="5" rx="3" fill="url(#rb)"/>
<text class="s" x="30" y="80" font-size="13" letter-spacing="3" fill="#8b93a7">THREE WAYS IN</text><text class="s" x="30" y="122" font-size="34" font-weight="800" fill="#f3f4f6">Pick your first adventure</text><rect x="30" y="160" width="433" height="240" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="30" y="160" width="433" height="4" rx="2" fill="#ffb347"/><text class="s" x="52" y="200" font-size="11" letter-spacing="3" fill="#ffb347">🔎 LOOK AROUND</text><text class="s" x="52" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Open the searches</text><text class="s" x="52" y="260" font-size="14" fill="#aab2c5">launch-radar queries --urls</text><text class="s" x="52" y="282" font-size="14" fill="#aab2c5">prints six X searches. Open</text><text class="s" x="52" y="304" font-size="14" fill="#aab2c5">them with Latest selected.</text><rect x="52" y="316" width="389" height="36" rx="8" fill="#080a10" stroke="#1b2235"/><text class="m" x="64" y="336" font-size="13" fill="#ffb347">launch-radar queries --urls</text><rect x="483" y="160" width="433" height="240" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="483" y="160" width="433" height="4" rx="2" fill="#7bed9f"/><text class="s" x="505" y="200" font-size="11" letter-spacing="3" fill="#7bed9f">📂 BRING A DUMP</text><text class="s" x="505" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Score what you have</text><text class="s" x="505" y="260" font-size="14" fill="#aab2c5">Any JSON list of posts.</text><text class="s" x="505" y="282" font-size="14" fill="#aab2c5">X API v2 field names work as-is.</text><text class="s" x="505" y="304" font-size="14" fill="#aab2c5">Ranked table or JSON out.</text><rect x="505" y="316" width="389" height="36" rx="8" fill="#080a10" stroke="#1b2235"/><text class="m" x="517" y="336" font-size="13" fill="#7bed9f">launch-radar scan posts.json --min 40</text><rect x="936" y="160" width="433" height="240" rx="16" fill="#0f1320" stroke="#1f2840"/><rect x="936" y="160" width="433" height="4" rx="2" fill="#c56cf0"/><text class="s" x="958" y="200" font-size="11" letter-spacing="3" fill="#c56cf0">🧩 BUILD ON IT</text><text class="s" x="958" y="232" font-size="21" font-weight="700" fill="#f3f4f6">Use it as a library</text><text class="s" x="958" y="260" font-size="14" fill="#aab2c5">Post.from_dict, rank, score.</text><text class="s" x="958" y="282" font-size="14" fill="#aab2c5">Feed it from an extension,</text><text class="s" x="958" y="304" font-size="14" fill="#aab2c5">a bot, a cron job.</text><rect x="958" y="316" width="389" height="36" rx="8" fill="#080a10" stroke="#1b2235"/><text class="m" x="970" y="336" font-size="13" fill="#c56cf0">from launch_radar import rank</text></svg>
