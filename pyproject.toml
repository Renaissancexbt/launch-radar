[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launch-radar"
version = "0.1.0"
description = "Find brand-new project launches on X before the crowd does."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Renaissancexbt"}]
keywords = ["x", "twitter", "launch", "startup", "radar", "scoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
launch-radar = "launch_radar.cli:main"

[project.urls]
Homepage = "https://github.com/Renaissancexbt/launch-radar"

[tool.setuptools.packages.find]
include = ["launch_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
